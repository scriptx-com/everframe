// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
// @generated begin react-native-google-cast-version - expo prebuild (DO NOT MODIFY) sync-db817f4a724fb91198c6371e63f6b1188e44e98d
        castFrameworkVersion = findProperty('castFrameworkVersion') ?: '+'
// @generated end react-native-google-cast-version
        supportLibVersion = "28.0.0"
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '36')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'
        // media3 is shared by the whole APK: react-native-video reads this ext (its own default
        // is 1.4.1) and THEOplayer core's POM declares 1.9.2, so both engines resolve to one
        // version. The MINOR is the constraint, not the patch — THEOplayer ships classes inside
        // androidx.media3.* and every 11.x release is built against 1.9.x, and media3 drops
        // deprecated symbols on minor boundaries (1.11.0 removed 11 classes), so a minor bump
        // risks a runtime NoSuchMethodError rather than a build failure. Follow THEOplayer for
        // the next minor; patches within 1.9.x are safe.
        media3Version = '1.9.4'
        androidxCoreVersion = '1.17.0'
        androidxActivityVersion = '1.9.3'

        ndkVersion = "27.1.12297006"
         {{ENV INJECTION}}
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.example.com/releases' }
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        // @generated begin everframe-gradle-plugin
        classpath("dev.everframe:gradle-plugin:1.2.0")
        // @generated end everframe-gradle-plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // classpath("com.google.devtools.ksp:1.9.23-1.0.20") 
    }
}

// plugins {
//     kotlin("jvm") version "1.9.23"
//     id 'com.google.devtools.ksp' version '1.9.23-1.0.20'
// }

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            url("$rootDir/local")
        }
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
        maven {
            // THEOplayer ads-wrapper AAR/POM shipped inside react-native-theoplayer —
            // avoids per-client-config vendoring when bumping the package version.
            url(new File(['node', '--print', "require.resolve('react-native-theoplayer/package.json')"].execute(null, rootDir).text.trim(), '../android/local'))
        }
        maven { url 'https://maven.example.com/releases' }
        maven { url "$rootDir/../node_modules/@notifee/react-native/android/libs" }
    }
}
