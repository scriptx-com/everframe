#
# AGP/AndroidX configuration for the TraceItX Android SDK build.

# AndroidX is required for AGP 8.7.x and any androidx.* dependency.
android.useAndroidX=true

# Avoid stale-config noise on incremental builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Kotlin code style.
kotlin.code.style=official

# Suppress AGP warning for Kotlin 2.1.x against AGP 8.7.x.
android.suppressUnsupportedCompileSdk=35

# Unified SDK version — read by traceitx-core/reporter-ui/protocol publishing
# blocks via `project.findProperty("traceitxVersion")`. Bump in lockstep with
# the JS + iOS SDK versions per PUBLISHING.md.
traceitxVersion=0.8.2
