#
# AGP/AndroidX configuration for the Everframe Android SDK build.

# AndroidX is required for AGP 8.7.x and any androidx.* dependency.
android.useAndroidX=true

# Avoid stale-config noise on incremental builds.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Kotlin code style.
kotlin.code.style=official

# Suppress AGP warning for Kotlin 2.1.x against AGP 8.7.x.
android.suppressUnsupportedCompileSdk=35

# Native SDK version — read by the Android publications. Match the iOS native
# version required by Flutter and KMP; npm packages have independent releases.
everframeVersion=0.10.0
