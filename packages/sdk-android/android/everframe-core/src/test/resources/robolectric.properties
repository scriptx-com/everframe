# SDK level for all Robolectric tests in :everframe-core unit-test source set.
#
# Why: project pins compileSdk/targetSdk = 35 (android/build.gradle.kts:35) but
# Robolectric 4.13 bundles emulated runtimes only up to SDK 34. Without this
# override, every @RunWith(RobolectricTestRunner) class fails at init with
# "Package targetSdkVersion=35 > maxSdkVersion=34".
#
# Drop this file when Robolectric is bumped to 4.14+ (adds SDK 35 support).
sdk=34
