<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>vitals perf harness (hls)</title>
<style>body{margin:0;background:#111;color:#eee;font:14px system-ui}video{width:640px;height:360px;display:block}</style>
</head><body>
<video id="v" muted autoplay playsinline></video>
<p id="status">booting</p>
<script src="/vendor/hls.js"></script>
<script type="module">
  import { init } from '/dist/browser/index.js';
  const h = init({ apiKey: 'pk_perf', appVersion: '0.0.0-perf' });
  window.__traceitx = h;
  const v = document.getElementById('v');
  const hls = new Hls();
  hls.loadSource(window.__HLS_URL || 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8');
  hls.attachMedia(v);
  // The `autoplay` attribute alone is unreliable once hls.js has attached a
  // MediaSource — explicitly kick off playback once the manifest is parsed,
  // same as hls.js's own docs recommend.
  hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
  h.trackPlayer({ element: v, hls, name: 'perf' });
  document.getElementById('status').textContent = 'sdk-init';
</script>
</body></html>
