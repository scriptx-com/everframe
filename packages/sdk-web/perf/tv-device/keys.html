<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Everframe TV key-delivery harness</title>
    <style>
      body { margin: 0; background: #101418; color: #eee; font: 24px/1.3 sans-serif; }
      h1 { margin: 32px 40px 0; font-size: 44px; font-weight: normal; }
      p { margin: 8px 40px; color: #aaa; }
      #rail { display: flex; padding: 32px 40px; }
      .tile { flex: 0 0 240px; height: 136px; margin-right: 24px; border-radius: 12px; background: #345; }
      .tile:focus, #video:focus { outline: 8px solid #fc0; outline-offset: 4px; }
      #video { display: block; margin: 0 40px; width: 480px; height: 270px; background: #000; }
      #log { position: fixed; right: 20px; top: 20px; bottom: 20px; width: 640px; overflow: hidden; font: 16px monospace; white-space: pre-wrap; background: rgba(0, 0, 0, .7); }
    </style>
  </head>
  <body>
    <h1>Key delivery</h1>
    <p id="mode"></p>
    <div id="rail">
      <div class="tile" id="tile-1" tabindex="0"></div>
      <div class="tile" id="tile-2" tabindex="0"></div>
      <div class="tile" id="tile-3" tabindex="0"></div>
    </div>
    <video id="video" tabindex="0" muted playsinline></video>
    <div id="log"></div>
    <script src="/keys-bundle.js"></script>
  </body>
</html>
