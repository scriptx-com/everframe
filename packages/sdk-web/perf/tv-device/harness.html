<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Everframe TV snapshot device harness</title>
<style>
  @font-face { font-family: "Harness Serif"; src: url("/fonts/harness.woff2") format("woff2"); }
  body { margin: 0; background: #f4f4f4; color: #111; font: 28px/1.3 "Harness Serif", sans-serif; }
  /* The fidelity fixture's dark theme comes from the media query, never hard-coded (spec §Verification). */
  @media (prefers-color-scheme: dark) { body { background: rgb(16, 20, 24); color: #eee; } }
  h1 { margin: 40px; font-size: 64px; font-weight: normal; }
  /* No flex `gap`: Chrome 53 and 79 lack it, and the server render's Chromium
     has it, so a gap would make the TV and the render lay out differently. */
  #rail { display: flex; overflow-x: auto; padding: 40px; }
  .tile { flex: 0 0 360px; height: 200px; margin-right: 24px; border-radius: 12px; background: #345 center/cover no-repeat; }
  .tile:focus { outline: 8px solid #fc0; outline-offset: 4px; }
  #vault { margin: 0 40px; padding: 20px; background: #533; }
  #report { margin: 40px; font: inherit; }
  #log { position: fixed; right: 20px; bottom: 20px; width: 700px; font: 18px monospace; white-space: pre-wrap; color: #eee; background: rgba(0, 0, 0, .7); }
</style>
</head>
<body>
  <h1>Harness home</h1>
  <div id="rail">
    <div class="tile" id="tile-1" tabindex="0" style="background-image:url(/posters/1.svg)"></div>
    <div class="tile" id="tile-2" tabindex="0" style="background-image:url(/posters/2.svg)"></div>
    <div class="tile" id="tile-3" tabindex="0" style="background-image:url(/posters/3.svg)"></div>
    <div class="tile" id="tile-4" tabindex="0" style="background-image:url(/posters/4.svg)"></div>
  </div>
  <section id="vault" data-everframe-sensitive>Account HARNESSSECRET 4111 1111 1111 1111</section>
  <button id="report" onclick="window.__everframeHandle.open()">Report</button>
  <div id="log" data-everframe-skip-capture="true"></div>
  <script src="/bundle.js"></script>
</body>
</html>
