<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TraceItX script-tag e2e fixture</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #0f1117; color: #e6e8ee; }
  main { padding: 32px; display: grid; gap: 16px; max-width: 720px; }
  .card { background: #171a23; border: 1px solid #2a2e3a; border-radius: 10px; padding: 20px; }
  .swatch { height: 56px; border-radius: 8px; background: linear-gradient(90deg,#ff5f6d,#ffc371); }
</style>
</head>
<body>
  <main>
    <div class="card">
      <h2 id="headline">Order #4471 failed to submit</h2>
      <div class="swatch"></div>
    </div>
    <button id="report">Report a bug</button>
  </main>
  <!-- The DOCUMENTED no-bundler integration, structurally character for
       character: ONE <script type="module"> that imports the browser entry by
       URL and calls init(). In the README that URL is a version-pinned
       jsDelivr path (…/@traceitx/web@0.6.6/dist/browser/index.js); here it is
       the same artifact served locally out of the same versioned directory.

       NO IMPORT MAP — that is the point of this fixture and the one thing
       separating it from plain.html. `dist/browser/index.js` is built with
       `noExternal: [/.*/]`, so every dependency (React, konva, rrweb,
       modern-screenshot) is inlined into this build's own chunk graph and no
       bare specifier survives for the browser to choke on. plain.html, loading
       `dist/index.js`, needs an import map to stand in for a consumer's
       bundler; this page needs nothing.

       ONE <script> block, not two. `type="module"` is DEFERRED, so a classic
       inline <script> placed after it would run FIRST — which is exactly why
       the old two-tag `window.traceitx` idiom could not survive the move off
       the IIFE, and why the documented snippet is a single module block. -->
  <script type="module">
    import { init } from '/dist/browser/index.js';
    window.__traceitx = init({ apiKey: 'pk_e2e', appVersion: '0.0.0-e2e' });
    document.getElementById('report').addEventListener('click', () => {
      // Swallowed for the same reason as plain.html's — see that fixture.
      window.__traceitx.open().catch(() => {});
    });
  </script>
</body>
</html>
