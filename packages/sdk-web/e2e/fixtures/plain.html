<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TraceItX vanilla e2e fixture</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #0f1117; color: #e6e8ee; }
  main { padding: 32px; display: grid; gap: 16px; max-width: 720px; }
  .card { background: #171a23; border: 1px solid #2a2e3a; border-radius: 10px; padding: 20px; }
  .swatch { height: 56px; border-radius: 8px; background: linear-gradient(90deg,#ff5f6d,#ffc371); }
</style>
</head>
<body>
  <main>
    <div class="card">
      <h2 id="headline">Order #4471 failed to submit</h2>
      <div class="swatch"></div>
    </div>
    <button id="report">Report a bug</button>
  </main>
  <!-- The eager entry reaches its two runtime dependencies by a BARE dynamic
       specifier (`modern-screenshot` for capture, `rrweb` for replay). A real
       consumer's bundler resolves those; a browser loading raw ESM cannot, and
       the SDK fails closed — capture silently degrades to a 1x1 transparent
       placeholder. The import map is this fixture standing in for the
       bundler; e2e/static-server.mjs serves both under /vendor/. -->
  <script type="importmap">
  {
    "imports": {
      "modern-screenshot": "/vendor/modern-screenshot.js",
      "rrweb": "/vendor/rrweb.js"
    }
  }
  </script>
  <script type="module">
    import { init } from '/dist/index.js';
    window.__traceitx = init({ apiKey: 'pk_e2e', appVersion: '0.0.0-e2e' });
    document.getElementById('report').addEventListener('click', () => {
      // Swallowed: open() resolves on submit and rejects if the reporter is
      // not mounted. A spec that opens the dialog and then ends leaves this
      // promise pending, and one that tears the page down mid-open would
      // otherwise surface an unhandled rejection that has nothing to do with
      // what is being tested.
      window.__traceitx.open().catch(() => {});
    });
  </script>
</body>
</html>
