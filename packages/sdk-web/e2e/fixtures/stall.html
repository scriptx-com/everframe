<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Everframe stalled-capture e2e fixture</title>
<style>
  /* An outlined capture root and a content-visibility:auto element: stock
     snapDOM restyles both LIVE for the duration of its clone. */
  body { margin: 0; padding: 24px; background: #fff; font: 16px/1.5 system-ui, sans-serif; color: #111; outline: 3px solid rgb(255, 0, 0); outline-offset: -3px; }
  #cv { content-visibility: auto; contain-intrinsic-size: auto 60px; }
  /* Single-line ellipsis over two text nodes (snapDOM measures it on the live page). */
  #label { width: 90px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .secret { width: 200px; height: 40px; background: #fff; color: #000; margin-top: 16px; }
  iframe { width: 300px; height: 80px; border: 0; display: block; margin-top: 16px; }
</style>
</head>
<body>
  <div id="label"></div>
  <div id="cv">content-visibility: auto</div>
  <!-- Same-origin iframe whose web font request never completes (the e2e
       test holds /stall-font.woff2): snapDOM's clone of it stalls. It comes
       BEFORE the holder, so the holder is cloned only after the stall. -->
  <iframe id="frame" srcdoc="<style>@font-face{font-family:Stall;src:url('/stall-font.woff2')}body{margin:0;font-family:Stall,serif}</style><p>stalled font</p>"></iframe>
  <div id="holder"><div class="secret" data-everframe-sensitive>4111 1111 1111 1111</div></div>
  <script>
    document.getElementById('label').append(
      document.createTextNode('$1,234,567.00'),
      document.createTextNode(' / month'),
    );
  </script>
  <!-- Same import map as capture-cases.html (stands in for the consumer's bundler). -->
  <script type="importmap">
  {
    "imports": {
      "modern-screenshot": "/vendor/modern-screenshot.js",
      "@zumer/snapdom": "/vendor/snapdom.js",
      "rrweb": "/vendor/rrweb.js"
    }
  }
  </script>
  <script type="module">
    import { init } from '/dist/index.js';
    window.__everframe = init({ sdkKey: 'pk_e2e', appVersion: '0.0.0-e2e' });
  </script>
</body>
</html>
