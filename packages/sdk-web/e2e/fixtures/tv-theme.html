<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Everframe TV snapshot theme-variables e2e fixture</title>
<!-- A var()-themed TV screen with a pruned previous screen: the pruning
     switches the snapshot's CSS to the masked policy, which must keep the
     colour/length theme variables (the dark surface, the focus ring) while
     still dropping a text-valued one. -->
<style>
  :root { --surface: #101018; --focus: #ffcc00; --ring: 6px; --patient-name: Alice Smith; }
  body { margin: 0; background: var(--surface); color: #fff; font: 32px/1.4 sans-serif; }
  h1 { margin: 40px; }
  .selected { margin: 40px; width: 200px; height: 80px; border: 0; background: #333; color: #fff; outline: var(--ring) solid var(--focus); }
</style>
</head>
<body>
  <section id="previous" style="display:none">Previous screen PREVIOUSSCREEN</section>
  <h1 id="heading">Movies</h1>
  <button id="play" class="selected">Play</button>
  <script type="importmap">
  {
    "imports": {
      "modern-screenshot": "/vendor/modern-screenshot.js",
      "@zumer/snapdom": "/vendor/snapdom.js",
      "rrweb": "/vendor/rrweb.js"
    }
  }
  </script>
  <script type="module">
    import { init } from '/dist/index.js';
    window.__everframe = init({ apiKey: 'pk_e2e', appVersion: '0.0.0-e2e' });
  </script>
</body>
</html>
