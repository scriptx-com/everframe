name: everframe_flutter
description: Flutter bridge for Everframe reporting on Android and iOS.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.everframe.flutter
        pluginClass: EverframeFlutterPlugin
      ios:
        pluginClass: EverframeFlutterPlugin
