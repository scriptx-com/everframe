name: everframe_flutter
description: Flutter bridge for Everframe reporting on Android and iOS.
version: 0.1.1
homepage: https://everframe.dev
repository: https://github.com/scriptx-com/everframe
issue_tracker: https://github.com/scriptx-com/everframe/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.everframe.flutter
        pluginClass: EverframeFlutterPlugin
      ios:
        pluginClass: EverframeFlutterPlugin
