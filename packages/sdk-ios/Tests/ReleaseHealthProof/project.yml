name: ReleaseHealthProof
options:
  bundleIdPrefix: dev.everframe
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TVOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: Proof.entitlements
    SWIFT_OBJC_BRIDGING_HEADER: Faults.h
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReleaseHealthProof:
    type: application
    platform: iOS
    # One target serves both simulators, like the SDK project; the runner picks
    # the slice with -sdk iphonesimulator or -sdk appletvsimulator. Set at
    # target level so XcodeGen's iOS preset does not narrow the device family.
    settings:
      base:
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator appletvos appletvsimulator"
        TARGETED_DEVICE_FAMILY: "1,2,3"
    sources:
      - path: .
        excludes: ["project.yml", "README.md"]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Release Health Proof
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Send synthetic crash reports to the loopback qualification API.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    dependencies:
      - framework: ${EVERFRAME_PROOF_FRAMEWORKS}/EverframeKit.framework
        embed: true
      - framework: ${EVERFRAME_PROOF_FRAMEWORKS}/EverframeProtocol.framework
        embed: true
schemes:
  ReleaseHealthProof:
    build:
      targets:
        ReleaseHealthProof: all
