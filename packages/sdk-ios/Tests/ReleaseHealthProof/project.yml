name: ReleaseHealthProof
options:
  bundleIdPrefix: dev.everframe
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_ENTITLEMENTS: Proof.entitlements
    SWIFT_OBJC_BRIDGING_HEADER: Faults.h
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ReleaseHealthProof:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes: ["project.yml", "README.md"]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Release Health Proof
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Send synthetic crash reports to the loopback qualification API.
    dependencies:
      - framework: ${EVERFRAME_PROOF_FRAMEWORKS}/EverframeKit.framework
        embed: true
      - framework: ${EVERFRAME_PROOF_FRAMEWORKS}/EverframeProtocol.framework
        embed: true
schemes:
  ReleaseHealthProof:
    build:
      targets:
        ReleaseHealthProof: all
