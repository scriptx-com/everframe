<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><title>KMP canvas reporter probe</title></head>
<body>
  <canvas id="scene" width="100" height="80"></canvas>
  <script type="module">
    import { init, INGEST_URL, createCanvasVisualCapture } from '/sdk/index.js';
    if (INGEST_URL !== 'http://127.0.0.1:8938') throw new Error('Loopback SDK required');
    const canvas = document.querySelector('#scene');
    const context = canvas.getContext('2d');
    function paint(color) {
      context.fillStyle = color;
      context.fillRect(0, 0, 100, 80);
      context.fillStyle = '#ff00ff';
      context.fillRect(30, 20, 30, 30);
    }
    paint('#00cc00');
    window.changeKmpFrame = () => paint('#0066ff');
    window.kmpProbe = init({
      apiKey: 'pk_kmp_probe',
      appVersion: '0.0.0-probe',
      sdkName: 'everframe-kmp',
      sdkVersion: '0.10.2',
      visualCapture: createCanvasVisualCapture({
        canvas,
        sensitiveRects: () => [{ x: 30, y: 20, width: 30, height: 30 }],
      }),
    });
  </script>
</body>
</html>
