<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Everframe Flutter web probe</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
  <script type="module">
    import { init, INGEST_URL } from '/sdk/index.js';
    import { flutterVisualCapture } from './probe_visual.js';
    if (INGEST_URL !== 'http://127.0.0.1:8938') {
      throw new Error('Flutter probe requires an SDK bundle configured for loopback ingest');
    }
    const start = () => {
      window.__everframeProbe = init({
        apiKey: 'pk_flutter_probe',
        appVersion: '0.0.0-probe',
        sdkName: 'everframe-flutter',
        sdkVersion: '0.0.0+1',
        visualCapture: flutterVisualCapture(),
      });
    };
    if (window.everframeFlutterBridgeReady) start();
    else window.addEventListener('everframe-flutter-ready', start, { once: true });
  </script>
</body>
</html>
