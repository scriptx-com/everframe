			shellPath = /bin/sh;
			shellScript = "#!/usr/bin/env bash\n# SPDX-License-Identifier: MIT\n# SPDX-FileCopyrightText: 2026 ScriptX\n#\n# Materialize examples/ios-native/Config/Local.xcconfig from the repo-root .env.\n# Idempotent. Reads EVERFRAME_KEY_IOS (this probe's own dashboard app key) and\n# hard-fails if it's missing or malformed, rather than baking an empty key that\n# would throw .missingAppId at SampleApp launch.\n#\n# The ingest URL is no longer projected here — the SDK bakes it at compile\n# time via #if DEBUG / Release. To override locally for the SDK build itself,\n# set EVERFRAME_DEV_INGEST_URL in your Xcode scheme env.\nset -euo pipefail\n\n# Locate the sample-app directory (examples/ios-native), from which the repo\n# root and the output path are both derived.\n#\n# `$SRCROOT` FIRST, and BASH_SOURCE only as the fallback. Xcode does not execute\n# this file in place: it inlines the script's text into a generated\n# `Script-<uuid>.sh` under DerivedData and runs THAT, so inside a build phase\n# `${BASH_SOURCE[0]}` points at\n# …/Build/Intermediates.noindex/…/IntermediateBuildFilesPath/, and\n# `${SCRIPT_DIR}/../../..` resolves to a DerivedData ancestor rather than the\n# checkout. The script then looked for `.env` inside DerivedData, never found\n# it, and — now that a missing file is fatal rather than a warning — failed the\n# build outright with a path no one recognises.\n#\n# The older, permissive version of this script had the identical bug and hid\n# it: it warned, continued, and emitted an EMPTY INGEST_SDK_KEY, so the sample\n# app built fine and then threw `.missingAppId` at launch. \"Build succeeds,\n# app dies on start\" was the bug; the hard-fail exposed it rather than causing\n# it.\n#\n# Xcode always sets SRCROOT to the .xcodeproj's directory (examples/ios-native),\n# which is exactly the anchor needed. Direct CLI runs (`pnpm gen-ios-config`,\n# or invoking this file by hand) have no SRCROOT and fall back to the\n# file-relative path, which is correct in that context.\nif [[ -n \"${SRCROOT:-}\" ]]; then\n    APP_DIR=\"${SRCROOT}\"\nelse\n    APP_DIR=\"$(cd \"$(dirname \"${BASH_SOURCE[0]}\")/..\" && pwd)\"\nfi\nREPO_ROOT=\"$(cd \"${APP_DIR}/../..\" && pwd)\"\nENV_FILE=\"${REPO_ROOT}/.env\"\nOUT_FILE=\"${APP_DIR}/Config/Local.xcconfig\"\n\nSRC_VAR=\"EVERFRAME_KEY_IOS\"\nINGEST_SDK_KEY=\"\"\n\nif [[ ! -f \"${ENV_FILE}\" ]]; then\n    echo \"error: ${ENV_FILE} not found. Copy .env.example → .env and set ${SRC_VAR} to the iOS app's SDK key.\" 1>&2\n    exit 1\nfi\n\n# Extract the value, stripping any inline `# comment` and surrounding\n# whitespace (matches dotenv semantics used by the ingest service).\nINGEST_SDK_KEY=\"$(grep -E \"^${SRC_VAR}=\" \"${ENV_FILE}\" | tail -1 | cut -d= -f2- | sed -E 's/[[:space:]]+#.*$//; s/^[[:space:]]+//; s/[[:space:]]+$//')\"\n\nif [[ ! \"${INGEST_SDK_KEY}\" =~ ^txx_live_.{32}$ ]]; then\n    echo \"error: ${SRC_VAR} in ${ENV_FILE} is missing or malformed (need 'txx_live_' + 32-char body = 41 chars).\" 1>&2\n    echo \"       Create an 'iOS' app in the dashboard (http://localhost:8787/admin/), generate its SDK key,\" 1>&2\n    echo \"       and paste it as ${SRC_VAR}=txx_live_… in the repo-root .env.\" 1>&2\n    exit 1\nfi\n\nmkdir -p \"$(dirname \"${OUT_FILE}\")\"\ncat > \"${OUT_FILE}\" <<EOF\n// GENERATED BY scripts/gen-local-xcconfig.sh — DO NOT EDIT BY HAND.\n// Source of truth: repo-root .env. Regenerate via 'pnpm gen-ios-config'.\nINGEST_SDK_KEY = ${INGEST_SDK_KEY}\nEOF\n\necho \"wrote ${OUT_FILE}\"\n";
