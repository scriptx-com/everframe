#
# xcodegen spec for the TraceItX sample app.
# Three schemes — SampleApp-iPhone, SampleApp-iPad, SampleAppTV — point at the
# two underlying targets but differ in default destination so users can pick
# the form factor from Xcode's scheme selector without re-editing the run
# destination each time.
#
# Regenerate the project after editing this file:
#     xcodegen generate --spec examples/ios-native/project.yml --project examples/ios-native
#
# The generated project.pbxproj is committed alongside this spec so that
# downstream consumers can open SampleApp.xcodeproj without installing
# xcodegen first; CI regenerates and diff-checks via the xcodegen drift gate.

name: SampleApp
options:
  bundleIdPrefix: com.scriptx.traceitx.sample
  deploymentTarget:
    iOS: "16.0"
    tvOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

packages:
  TraceItX:
    path: ../../packages/sdk-ios

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""

targets:
  SampleApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: "Generate Local.xcconfig from root .env"
        path: scripts/gen-local-xcconfig.sh
        basedOnDependencyAnalysis: false
    sources:
      - path: SampleApp
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scriptx.traceitx.sample
        TARGETED_DEVICE_FAMILY: "1,2"  # 1 = iPhone, 2 = iPad — universal
        INFOPLIST_FILE: SampleApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: TraceItX
        product: TraceItXKit
      - package: TraceItX
        product: TraceItXReporterUI

  SampleAppTV:
    type: application
    platform: tvOS
    deploymentTarget: "16.0"
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    preBuildScripts:
      - name: "Generate Local.xcconfig from root .env"
        path: scripts/gen-local-xcconfig.sh
        basedOnDependencyAnalysis: false
    sources:
      - path: SampleAppTV
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scriptx.traceitx.sample.tv
        TARGETED_DEVICE_FAMILY: "3"  # 3 = Apple TV
        INFOPLIST_FILE: SampleAppTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: TraceItX
        product: TraceItXKit
      - package: TraceItX
        product: TraceItXReporterUI

schemes:
  SampleApp-iPhone:
    build:
      targets:
        SampleApp: all
    run:
      config: Debug
      commandLineArguments: {}
      environmentVariables:
        TRACEITX_DEV_INGEST_URL: http://localhost:8787
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SampleApp-iPad:
    build:
      targets:
        SampleApp: all
    run:
      config: Debug
      environmentVariables:
        TRACEITX_DEV_INGEST_URL: http://localhost:8787
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  SampleAppTV:
    build:
      targets:
        SampleAppTV: all
    run:
      config: Debug
      environmentVariables:
        TRACEITX_DEV_INGEST_URL: http://localhost:8787
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
