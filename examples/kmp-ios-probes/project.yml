name: KmpIosProbes
options:
  bundleIdPrefix: dev.everframe.kmpprobe
  deploymentTarget:
    iOS: "17.0"
packages:
  Everframe:
    path: ../../packages/sdk-ios
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGNING_ALLOWED: NO
    DEVELOPMENT_TEAM: ""
targets:
  KmpNativeProbe:
    type: application
    platform: iOS
    sources:
      - path: ../../packages/everframe_kmp/ios/EverframeSwiftDriver.swift
      - path: ../kmp-ios-native-probe/KmpNativeProbeApp.swift
    info:
      path: KmpNativeProbe-Info.plist
      properties:
        CFBundleDisplayName: KMP Native Probe
        EverframeDevIngestURL: http://127.0.0.1:8787
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: Everframe
        product: Everframe
      - package: Everframe
        product: EverframeReporterUI
      - framework: ../../packages/everframe_kmp/build/bin/iosSimulatorArm64/debugFramework/EverframeKmp.framework
        embed: true
  KmpComposeHost:
    type: application
    platform: iOS
    sources:
      - path: ../../packages/everframe_kmp/ios/EverframeSwiftDriver.swift
      - path: ../kmp-compose-mobile-probe/ios/KmpComposeProbeApp.swift
    info:
      path: KmpComposeHost-Info.plist
      properties:
        CFBundleDisplayName: KMP Compose Probe
        EverframeDevIngestURL: http://127.0.0.1:8787
        CADisableMinimumFrameDurationOnPhone: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - package: Everframe
        product: Everframe
      - package: Everframe
        product: EverframeReporterUI
      - framework: ../../packages/everframe_kmp/build/bin/iosSimulatorArm64/debugFramework/EverframeKmp.framework
        embed: true
      - framework: ../kmp-compose-mobile-probe/build/bin/iosSimulatorArm64/debugFramework/KmpComposeProbe.framework
        embed: true
  KmpNativeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/NativeProbeUITests.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KmpNativeProbe
    dependencies:
      - target: KmpNativeProbe
  KmpComposeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/ComposeProbeUITests.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: KmpComposeHost
    dependencies:
      - target: KmpComposeHost
schemes:
  KmpNativeProbe:
    build:
      targets:
        KmpNativeProbe: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [KmpNativeUITests]
  KmpComposeProbe:
    build:
      targets:
        KmpComposeHost: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [KmpComposeUITests]
