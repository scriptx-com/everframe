name: Formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Use the same exact version as local commands without installing native SDK tooling.
      - name: Check formatting
        run: pnpm dlx "prettier@$(node -p 'require("./package.json").devDependencies.prettier')" --check .
