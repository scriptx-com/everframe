name: Apple SDK CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  swift-and-tvos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Test Swift package
        env:
          EVERFRAME_DEV_INGEST_URL: http://127.0.0.1:9
        # Swift Testing runs suites concurrently by default, but these SDK tests
        # deliberately exercise shared process-global capture state.
        run: swift test --package-path packages/sdk-ios --no-parallel
      # The vendored crash recorder is a separate package: check its pinned hashes,
      # dated modifications and merged privacy manifest, then compile it.
      - name: Verify vendored crash recorder source
        run: node packages/sdk-ios/crash-recorder/scripts/verify-vendor.mjs
      - name: Build crash recorder
        run: swift build --package-path packages/sdk-ios/crash-recorder --product EFCRProbe
      - name: Crash recorder admission regression
        run: packages/sdk-ios/crash-recorder/Tests/gate-admission.sh "$RUNNER_TEMP/gate-admission"
